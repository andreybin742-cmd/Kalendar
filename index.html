header{max-width:1040px;margin:auto;padding:40px 18px 8px}
h1{margin:0;font-size:clamp(34px,8vw,68px);font-weight:800;letter-spacing:-1px;text-transform:uppercase}
.sub{color:var(--mut);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 0}
.glass{background:var(--gl);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}
.next{max-width:1004px;margin:14px 18px 0;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(min-width:1040px){.next{margin:14px auto 0}}
.next small{color:var(--mut);font-size:11px;letter-spacing:2px;text-transform:uppercase;display:block}.next b{font-size:19px}.cd{color:var(--ac);font-size:22px;font-weight:700}
.bar{position:sticky;top:0;z-index:5;padding:8px 18px;display:grid;gap:6px;background:rgba(10,10,13,.84);backdrop-filter:blur(14px)}
.bar>section{max-width:1004px;width:100%;margin:auto}
.filter-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);padding:2px 5px 5px}
.filter-group>div.glass{padding:7px 9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,input{font:inherit;font-size:14px;color:var(--tx);background:var(--gl2);border:1px solid transparent;border-radius:99px;padding:7px 14px;cursor:pointer;transition:.25s}
button:hover{border-color:var(--bd)}button.on{background:rgba(255,255,255,.22);border-color:var(--bd)}
.sep{width:1px;height:22px;background:var(--bd);margin:0 4px}
input{cursor:text;flex:1;min-width:120px;outline:none}input:focus{border-color:var(--bd)}
main{max-width:1040px;margin:auto;padding:0 18px 70px}
.view{display:none;animation:fi .5s}.view.on{display:block}@keyframes fi{from{opacity:0;transform:translateY(14px)}}
h2{margin:30px 0 10px;font-size:20px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--ac)}
.card{margin:9px 0;padding:14px 18px;cursor:pointer;opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s,background .3s}
.card.in{opacity:1;transform:none}.card:hover{background:rgba(30,30,36,.55)}
.card.past{opacity:.4!important}
.row{display:flex;gap:16px;align-items:center}
.fav-btn{flex:0 0 auto;min-width:38px;padding:6px 10px;font-size:20px;color:var(--ac);line-height:1}
.ev1 .fav-btn{float:right}
.d{min-width:70px;text-align:center;font-weight:800;font-size:23px;line-height:1;color:var(--ac)}.d small{display:block;font-size:11px;color:var(--mut);margin-top:4px;font-weight:600;letter-spacing:1px}
.i{flex:1}.i b{font-size:17px;display:block}.i span{color:var(--mut);font-size:14px}
.tag{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap}.tag.j{color:var(--jam)}.tag.f{color:var(--fed)}
.more{max-height:0;overflow:hidden;transition:max-height .45s ease,margin .3s;color:var(--mut);font-size:14px}.card.open .more{max-height:480px;margin-top:12px}.more img{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin:10px 0}
.btn{display:inline-block;margin-top:6px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:14px}.btn:hover{background:rgba(255,255,255,.26)}
.btn.off{opacity:.5;pointer-events:none}
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:20px}
.mo{padding:12px}.mo h3{margin:0 0 8px;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:600}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.wd{font-size:10px;color:var(--mut);text-align:center}
.c{min-height:46px;border-radius:7px;background:rgba(255,255,255,.04);padding:2px 3px;font-size:10px;color:var(--mut);overflow:hidden}
.c.ev{background:rgba(224,178,122,.14);cursor:pointer;color:var(--tx);border:1px solid rgba(224,178,122,.35)}.c.ev:hover{background:rgba(224,178,122,.28)}
.c.td{outline:1px solid var(--tx)}
.c i{display:block;font-style:normal;font-size:8.5px;line-height:1.15;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--jam);padding-left:2px}.c i.f{border-color:var(--fed)}
.empty{text-align:center;color:var(--mut);padding:40px}
#md{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:16px}
#md.on{display:flex;animation:fi .3s}
#md .box{width:min(460px,100%);max-height:85vh;overflow:auto;padding:22px;background:rgba(18,18,22,.62);animation:pop .35s}@keyframes pop{from{transform:scale(.92);opacity:0}}
.ev1{padding:12px 0;border-top:1px solid var(--bd)}.ev1:first-of-type{border:0}.ev1 b{font-size:18px;display:block;margin:4px 0}
.x{float:right;padding:4px 11px}
@media(max-width:560px){.row{flex-wrap:wrap}.d{min-width:56px;font-size:20px}.sep{display:none}}
</style></head><body>
<header><p class="sub">Россия · 2026 / 2027 · джемы · баттлы · чемпионаты</p><h1>Break Calendar</h1></header>
<div class="next glass" id="next"></div>
<div class="bar">
 <section class="filter-group"><div class="filter-title">Как смотреть</div><div class="glass" id="viewbar"></div></section>
 <section class="filter-group"><div class="filter-title">Что смотреть</div><div class="glass" id="f"></div></section>
</div>
<main><div class="view on" id="vl"></div><div class="view" id="vy"></div></main>
<div id="md"><div class="box glass" id="mb"></div></div>
<script>
// [год, мес, д1, д2, название, город, тип j|f, id группы ВК]
const E=[
[2026,10,17,0,"Block Party","Новокузнецк","j","98381673"],[2026,10,24,25,"OctoBreak","Новосибирск","j","59132346"],[2026,10,24,25,"Back to Back","Тюмень","j","226619581"],
[2026,11,6,8,"Джем для Всех","Красноярск","j","212701084"],[2026,11,7,8,"Irk Battle","Иркутск","j","216526769"],[2026,11,13,15,"ROBC","Москва","j","171892267"],[2026,11,20,22,"Глубинка Fest","Белово","j"],[2026,11,22,0,"Ghetto Blaster","Красноярск","j"],[2026,11,28,0,"Западный Круг","Ачинск","j"],
[2026,12,12,0,"Восточная Жара","Канск","j","156964566"],[2026,12,18,20,"Dubai Open","Дубай","j","171892267"],
[2027,1,15,17,"Всероссийское физкультурное мероприятие (ВФМ)","Казань","f"],[2027,1,16,17,"ЧиП Дальневосточного ФО","Хабаровск","f"],[2027,1,23,24,"ЧиП Южного и Северо-Кавказского ФО","Геленджик","f"],[2027,1,30,31,"ЧиП Уральского ФО","Ханты-Мансийск","f"],
[2027,2,6,7,"ЧиП Центрального ФО","Мытищи","f"],[2027,2,13,0,"Битва Медведей","Канск","j","213494195"],[2027,2,14,15,"ЧиП Северо-Западного ФО","Вологда","f"],[2027,2,20,21,"Break the Games","Иркутск","j","216526769"],[2027,2,20,21,"ЧиП Приволжского ФО","Самара","f"],[2027,2,27,28,"ЧиП СФО","Кемерово","f","171892267"],
[2027,3,13,14,"Break Rumble · Всероссийские соревнования","Архангельск","f","171892267"],[2027,3,27,28,"Раскрытие","Красноярск","j"],
[2027,4,17,18,"Number One","Новосибирск","j"],[2027,4,17,18,"ЧиП России","Москва","f","171892267"],[2027,4,24,25,"Irk Battle","Иркутск","j","216526769"],
[2027,5,1,2,"Алхимия","Красноярск","j"],[2027,5,7,9,"Inspiration","Красноярск","j"],[2027,5,22,23,"Break Rumble · Всероссийские соревнования","Хабаровск","f","171892267"],
[2027,6,18,0,"Кубок России","Москва","f"],[2027,6,18,20,"Summer Fest · ВС и ВФМ","Москва","f","171892267"],[2027,6,18,21,"Кубок мира","Москва","f"],
[2027,8,19,22,"Break Rumble · Всероссийские соревнования","Казань","f","171892267"],[2027,9,11,12,"SBS Anniversary 10","Новосибирск","j","219998263"],[2027,10,2,3,"Break Rumble · Всероссийские соревнования","Новосибирск","f","171892267"],
[2027,11,12,14,"ROBC · ВС и ВФМ","Москва","f","171892267"],[2027,11,12,14,"Кубок мира и международные соревнования","Москва","f"]];
const MN=["","Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],MS=["","янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
E.sort((a,b)=>new Date(a[0],a[1]-1,a[2])-new Date(b[0],b[1]-1,b[2]));
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const end=e=>new Date(e[0],e[1]-1,e[3]||e[2]);
const dt=e=>e[2]+(e[3]?"–"+e[3]:"")+" "+MS[e[1]];
const $=id=>document.getElementById(id);
let flt="all",q="",view="l";
const FAVORITES_KEY="breakCalendarFavorites_v1";
function readFavorites(){try{return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||"[]"))}catch(_){return new Set()}}
let favorites=readFavorites();
const eventKey=e=>String(e[10]||[e[0],e[1],e[2],e[4],e[5]].join("|"));
const isFavorite=e=>favorites.has(eventKey(e));
function favoriteButton(e,index){return '<button class="fav-btn" type="button" data-fav-index="'+index+'" aria-label="Добавить или убрать из избранного" title="Избранное">'+(isFavorite(e)?"★":"☆")+'</button>'}
function toggleFavorite(e){const id=eventKey(e);if(favorites.has(id))favorites.delete(id);else favorites.add(id);try{localStorage.setItem(FAVORITES_KEY,JSON.stringify([...favorites]))}catch(_){ }}
const viewTabs=[["l","Список"],["y","Календарь"]];
viewTabs.forEach(t=>{const b=document.createElement("button");b.textContent=t[1];b.dataset.k=t[0];b.onclick=()=>{view=t[0];render()};$("viewbar").appendChild(b)});
const filterTabs=[["all","Все"],["j","Джемы"],["f","ФТСАРР"],["up","Ближайшие"],["fav","★ Избранное"]];
filterTabs.forEach(t=>{const b=document.createElement("button");b.textContent=t[1];b.dataset.k=t[0];b.onclick=()=>{flt=t[0];render()};$("f").appendChild(b)});
const inp=document.createElement("input");inp.placeholder="Город или название…";inp.oninput=()=>{q=inp.value.toLowerCase();render()};$("f").appendChild(inp);
const ok=e=>{const p=end(e)<today;if(flt==="up"&&p)return 0;if(flt==="fav"&&!isFavorite(e))return 0;if((flt==="j"||flt==="f")&&e[6]!==flt)return 0;return !q||(e[4]+" "+e[5]).toLowerCase().includes(q)};
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vk=e=>{if(!e[7])return '<span class="btn off">Группы ВК нет</span>';const raw=String(e[7]),url=/^https?:\/\//i.test(raw)?raw:"https://vk.com/club"+raw;return '<a class="btn" href="'+escapeHTML(url)+'" target="_blank" rel="noopener">Группа ВКонтакте ↗</a>';};
function render(){
 document.querySelectorAll("#viewbar button").forEach(b=>b.classList.toggle("on",b.dataset.k===view));
 document.querySelectorAll("#f button").forEach(b=>b.classList.toggle("on",b.dataset.k===flt));
 $("vl").classList.toggle("on",view==="l");$("vy").classList.toggle("on",view==="y");
 view==="l"?list():year();
}
function list(){
 const m=$("vl");m.innerHTML="";let last="",n=0;
 E.forEach(e=>{if(!ok(e))return;
  const k=e[0]+"-"+e[1];if(k!==last){last=k;const h=document.createElement("h2");h.textContent=MN[e[1]]+" "+e[0];m.appendChild(h)}
  const c=document.createElement("div");c.className="card glass"+(end(e)<today?" past":"");
  c.innerHTML=`<div class="row"><div class="d">${e[2]}${e[3]?"–"+e[3]:""}<small>${MS[e[1]].toUpperCase()}</small></div><div class="i"><b></b><span>📍 ${escapeHTML(e[5])}</span></div><span class="tag ${e[6]}">${e[6]==="f"?"ФТСАРР":"Джем / баттл"}</span>${favoriteButton(e,0)}</div><div class="more">${dt(e)} ${e[0]} · ${escapeHTML(e[5])}<br>${e[8]?escapeHTML(e[8])+"<br>":""}${e[9]?'<img src="'+escapeHTML(e[9])+'" alt="Афиша мероприятия" loading="lazy">':""}${vk(e)}</div>`;
  c.querySelector("b").textContent=e[4];
  c.querySelector("[data-fav-index]").onclick=ev=>{ev.stopPropagation();toggleFavorite(e);render()};
  c.onclick=ev=>{if(!ev.target.closest("a,button"))c.classList.toggle("open")};m.appendChild(c);n++});
 if(!n)m.innerHTML='<div class="empty">Ничего не найдено</div>';
 const io=new IntersectionObserver(r=>r.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.1});
 m.querySelectorAll(".card").forEach((c,i)=>{c.style.transitionDelay=(i%4)*50+"ms";io.observe(c)});
}
function year(){
 const map={};E.forEach(e=>{if(!ok(e))return;for(let d=e[2];d<=(e[3]||e[2]);d++){const k=e[0]+"-"+e[1]+"-"+d;(map[k]=map[k]||[]).push(e)}});
 let h='<div class="yg">';
 for(let i=0;i<14;i++){const y=2026+Math.floor((9+i)/12),mo=(9+i)%12+1;
  const off=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate();
  h+=`<div class="mo glass"><h3>${MN[mo]} ${y}</h3><div class="g">`+"ПВСЧПСВ".split("").map((_,j)=>`<div class="wd">${["пн","вт","ср","чт","пт","сб","вс"][j]}</div>`).join("");
  for(let j=0;j<off;j++)h+="<div></div>";
  for(let d=1;d<=days;d++){const ev=map[y+"-"+mo+"-"+d],td=y==today.getFullYear()&&mo==today.getMonth()+1&&d==today.getDate();
   h+=`<div class="c${ev?" ev":""}${td?" td":""}"${ev?` data-k="${y}-${mo}-${d}"`:""}>${d}`+(ev?ev.slice(0,2).map(e=>`<i class="${e[6]}">${escapeHTML(e[4])}</i>`).join("")+(ev.length>2?`<i>+${ev.length-2}</i>`:""):"")+"</div>"}
  h+="</div></div>"}
 $("vy").innerHTML=h+"</div>";
 $("vy").querySelectorAll(".c.ev").forEach(c=>c.onclick=()=>modal(map[c.dataset.k],c.dataset.k));
}
function modal(evs,k){const [y,mo,d]=k.split("-");
 $("mb").innerHTML=`<button class="x" onclick="$('md').classList.remove('on')">✕</button><div style="color:var(--ac);letter-spacing:2px;text-transform:uppercase;font-size:13px">${d} ${MN[+mo]} ${y}</div>`+evs.map((e,i)=>`<div class="ev1"><span class="tag ${e[6]}">${e[6]==="f"?"ФТСАРР":"Джем / баттл"}</span>${favoriteButton(e,i)}<b class="t"></b><div style="color:var(--mut)">📍 ${escapeHTML(e[5])} · ${dt(e)}</div>${e[8]?'<div style="color:var(--mut);margin:8px 0">'+escapeHTML(e[8])+'</div>':""}${e[9]?'<img src="'+escapeHTML(e[9])+'" alt="Афиша мероприятия" loading="lazy" style="display:block;max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin:10px 0">':""}${vk(e)}</div>`).join("");
 $("mb").querySelectorAll(".t").forEach((t,i)=>t.textContent=evs[i][4]);
 $("mb").querySelectorAll("[data-fav-index]").forEach(btn=>btn.onclick=()=>{toggleFavorite(evs[Number(btn.dataset.favIndex)]);modal(evs,k)});
 $("md").classList.add("on")}
$("md").onclick=e=>{if(e.target.id==="md")$("md").classList.remove("on")};
function updateNext(){const e=E.find(e=>end(e)>=today),b=$("next");if(!e){b.style.display="none";return}
 const dd=Math.max(0,Math.ceil((new Date(e[0],e[1]-1,e[2])-now)/864e5));
 b.innerHTML=`<div><small>Ближайшее событие</small><b></b><div style="color:var(--mut)">📍 ${escapeHTML(e[5])} · ${dt(e)}</div></div><div class="cd">${dd>0?"через "+dd+" дн.":"сейчас"}</div>`;b.querySelector("b").textContent=e[4]}
render();updateNext();
async function loadExternalEvents(){
 try{
  const response=await fetch("./events.json",{cache:"no-store"});
  if(!response.ok)throw new Error("events.json: HTTP "+response.status);
  const data=await response.json();
  (Array.isArray(data.events)?data.events:[]).forEach(item=>{
   if(!item||!item.date||!item.title)return;
   const start=String(item.date).split("-").map(Number),finish=String(item.end_date||item.date).split("-").map(Number);
   if(start.length!==3||start.some(n=>!Number.isFinite(n)))return;
   const [year,month,day]=start;
   const endDay=finish[0]===year&&finish[1]===month?finish[2]:day;
   const kind=/фтс|чемпион|официаль/i.test(String(item.kind||""))?"f":"j";
   E.push([year,month,day,endDay===day?0:endDay,item.title,item.city||"",kind,item.vk_url||item.vk||"",item.details||"",item.poster_url||"",item.id||""]);
  });
  E.sort((a,b)=>new Date(a[0],a[1]-1,a[2])-new Date(b[0],b[1]-1,b[2]));
  render();updateNext();
 }catch(error){console.warn("Не удалось загрузить мероприятия из events.json",error)}
}
loadExternalEvents();
</script></body></html>
